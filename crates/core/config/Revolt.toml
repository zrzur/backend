# Every secret in this file is an example, shipped so a dev stack starts by
# itself. A release run refuses to start with any of them (see
# `Settings::example_secrets_for`). Real values go in Revolt.overrides.toml
# (git-ignored) or in REVOLT__SECTION__KEY environment variables.
production = false
disable_events_dont_use = false
environment = "dev"

[database]
# MongoDB connection URL
# Defaults to the container name specified in self-hosted
# EXAMPLE ONLY, not for production. A release run with a URL without a password refuses to start.
mongodb = "mongodb://database"
# Redis connection URL
# Defaults to the container name specified in self-hosted
# EXAMPLE ONLY, not for production. A release run with a URL without a password refuses to start.
redis = "redis://redis/"

[hosts]
# Web locations of various services
# Defaults assume all services are reverse-proxied
# See https://github.com/zrzur/self-hosted/blob/main/Caddyfile
#
# Remember to change these to https/wss where appropriate in production!
app = "http://127.0.0.1:14701"
api = "http://127.0.0.1:14702"
events = "ws://127.0.0.1:14703"
autumn = "http://127.0.0.1:14704"
january = "http://127.0.0.1:14705"
assets = ""
voso_legacy = ""
voso_legacy_ws = ""

[hosts.livekit]

[rabbit]
host = "rabbit"
port = 5672
username = "rabbituser"
# EXAMPLE ONLY, not for production. A release run with this value refuses to start.
password = "rabbitpass"
default_exchange = "revolt.default"

[rabbit.queues]
acks = "internal.ack"
events = "internal.event"

[api]

[api.registration]
# Whether an invite should be required for registration
# See https://github.com/zrzur/self-hosted
invite_only = false

[api.smtp]
# Email server configuration for verification
# Defaults to no email verification (host field is empty)
host = ""
# Public example value, not for production. Generate your own: see README.
username = ""
password = ""
from_address = "noreply@example.com"
# reply_to = "noreply@example.com"
# port = 587
# use_tls = true

[api.smtp.expiry]
expire_verification = 604800  # 3600 * 24 * 7
expire_password_reset = 86400  # 3600 * 24
expire_account_deletion = 86400  # 3600 * 24

[api.security]
# Authifier Shield API key
authifier_shield_key = ""
# Whether services are behind the Cloudflare network
trust_cloudflare = false
# easypwned endpoint
easypwned = ""
# Tenor API Key
tenor_key = ""
# Admin keys for future admin api and for bonfire reported image fetching
admin_keys = []
# Browser origins allowed to call /staff (the platform admin console).
# Local development only by default; production sets admin.zrzur.com
# explicitly once staff access controls are verified.
staff_origins = ["http://localhost:31030", "http://127.0.0.1:31030"]

[api.security.ratelimits]
# Requests to /auth/* one address may make in 10 seconds. Keep this default in
# production; only a test stack, where everything comes from one address,
# raises it in Revolt.overrides.toml.
auth = 15

[api.security.captcha]
# hCaptcha configuration
hcaptcha_key = ""
hcaptcha_sitekey = ""

[api.security.shield]
host = ""
key = ""

[api.workers]
# Maximum concurrent connections (to proxy server)
max_concurrent_connections = 50

[api.livekit]
# How long to ring devices for when calling in dms/groups, in seconds
call_ring_duration = 30

[api.audit_logs]
# How long audit log entries last before being removed, in seconds
expires_after = 2592000  # 30d

[api.livekit.nodes]

[api.interactions]
# Bots that receive interactions over HTTP. Each bot's signing secret is
# derived from this key, nothing per bot is stored. Empty switches it off,
# and so does a key under 32 bytes.
signing_key = ""
# Private networks only: allow http:// and private addresses as endpoints.
# Never on a public instance: it opens the door to SSRF.
allow_private_urls = false

[api.sessions]
# Most sessions one account keeps. A sign-in over this closes the least
# recently used one. Only a test stack, where parallel tests share one
# account, raises it in Revolt.overrides.toml.
limit = 10
# Days without use after which a session expires. 0 switches expiry off.
idle_days = 30

[api.users]
# Minimum allowed length of usernames
min_username_length = 2

[pushd]
# this changes the names of the queues to not overlap 
# prod/beta if they happen to be on the same exchange/instance.
# Usually they have to be, so that messages sent from one or the other get sent to everyone
production = true

# Changes how many users are processed in each chunk when resolving role/everyone mentions.
# Increasing this will resolve mentions faster, but will consume more memory while resolving.
mass_mention_chunk_size = 200

# How long pushd will cache resolved names for rendered message notifications.
# Increasing this will result in lower database usage, but may result in a situation where a user/channel/role name changes 
# and the notifications still resolve to the old name.
render_cache_time = 60

# none of these should need changing
exchange = "revolt.notifications"
message_queue = "notifications.origin.message"
mass_mention_queue = "notifications.origin.mass_mention" # handles messages that contain role or everyone mentions
fr_accepted_queue = "notifications.ingest.fr_accepted"   # friend request accepted
fr_received_queue = "notifications.ingest.fr_received"   # friend request received
dm_call_queue = "notifications.ingest.dm_call"   # direct message voice call
generic_queue = "notifications.ingest.generic"           # generic messages (title + body)
ack_queue = "notifications.process.ack"                  # updates badges for apple devices


[pushd.vapid]
queue = "notifications.outbound.vapid"
# EXAMPLE ONLY, not for production. A release run with this value refuses to start.
# Public example value, not for production. Generate your own: see README.
private_key = ""
# EXAMPLE ONLY, the pair of the private key above; change them together.
public_key = "BGcvgR-i2z4IQ5Mw841vJvkLjt8wY-FjmWrw83jOLCY52qcGZS0OF7nfLzuYbjsQISwVO2HXrmf18gLWVX3Kwfw="

[pushd.fcm]
queue = "notifications.outbound.fcm"
key_type = ""
project_id = ""
private_key_id = ""
# Public example value, not for production. Generate your own: see README.
private_key = ""
client_email = ""
client_id = ""
auth_uri = ""
token_uri = ""
auth_provider_x509_cert_url = ""
client_x509_cert_url = ""

[pushd.apn]
sandbox = false
queue = "notifications.outbound.apn"
pkcs8 = ""
key_id = ""
team_id = ""

[january]
blocked_domains = []
# When set, /embed answers only the API workers, which send this key.
# Generate your own with `openssl rand -base64 32`; empty keeps it open.
embed_key = ""
# Signs media proxy tickets, on both the API and January.
# Generate your own with `openssl rand -base64 32`.
proxy_key = ""
# Turn on after every client in use sends tickets. Needs proxy_key.
require_proxy_ticket = false

[files]
# Encryption key for stored files
# Generate your own key using `openssl rand -base64 32`
# EXAMPLE ONLY, not for production. A release run with this value refuses to start.
# Public example value, not for production. Generate your own: see README.
encryption_key = "qcuMA+ssxhMyKaNAKBGFfryfFtUH8NDlamQyDwGW6fU="
# Quality used for lossy WebP previews (set to 100 for lossless)
webp_quality = 90.0
# Mime types that cannot be uploaded or served
#
# Example for Windows executables and Android installation files:
# ["application/vnd.microsoft.portable-executable", "application/vnd.android.package-archive"]
blocked_mime_types = []
# ClamAV service
# hostname:port
clamd_host = ""
# Mime types that should be virus scanned
#
# Leave empty to scan all file types
scan_mime_types = [
    "application/vnd.microsoft.portable-executable",
    "application/vnd.android.package-archive",
    "application/zip",
]

[files.purge]
# Purge by URL at Cloudflare when a file is deleted, a design is suspended or
# violating content is removed. Both empty: no purge, and `s-maxage` stays at
# one hour. Fill them in Revolt.overrides.toml (git-ignored) or with
# REVOLT__FILES__PURGE__ZONE_ID and REVOLT__FILES__PURGE__API_TOKEN.
# The token is limited to Cache Purge on the files zone.
zone_id = ""
api_token = ""
api_url = "https://api.cloudflare.com/client/v4"

[files.limit]
# Minimum file size (in bytes)
min_file_size = 1
# Minimum image resolution
min_resolution = [1, 1]
# Maximum MP of images
max_mega_pixels = 40
# Maximum pixel side of an image
max_pixel_side = 10_000

[files.preview]
# Maximum image resolution
attachments = [1280, 1280]
avatars = [256, 256]
backgrounds = [1280, 720]
icons = [256, 256]
# lobby banners fill wide screens: keep previews sharp
banners = [1920, 1920]
emojis = [128, 128]
decorations = [512, 512]
effects = [256, 456]

[files.s3]
# Configuration for S3
# Defaults included for MinIO + self-hosted setup
#
# Backblaze B2:
# - endpoint is listed on the "Buckets" page
# - path_style_buckets is set to true
# - region is `eu-central-003` string from endpoint URL
# - access_key_id is keyID generated on the "Application Keys" page
# - secret_access_key is token generated on the "Application Keys" page
# - default_bucket matches the name of the bucket you've created

# S3 protocol endpoint
endpoint = "http://minio:9000"
# Whether to use path-style buckets
# Generally true, except for MinIO
path_style_buckets = false
# S3 region name
region = "minio"
# S3 protocol key ID
# EXAMPLE ONLY, not for production. A release run with this value refuses to start.
# Public example value, not for production. Generate your own: see README.
access_key_id = "minioautumn"
# S3 protocol access key
# EXAMPLE ONLY, not for production. A release run with this value refuses to start.
secret_access_key = "minioautumn"
default_bucket = "revolt-uploads"


[features]
# Feature gate options
webhooks_enabled = false
# Plugins: the store, publishing, review and installs, staff routes included.
# Off, every plugin route answers PluginsDisabled and the app loads no plugin,
# also for people who installed one. Stored data stays; turning this on brings
# it back (restart delta).
plugins_enabled = false
# Forwarding a message to another channel (copy with a "Forwarded" origin).
# Off, the route answers FeatureDisabled and the app hides the action.
message_forwarding_enabled = false
# Enable push notifications for mass pings (everyone, online, roles)
# When false this will still ping in-client but will not send notifications from pushd
mass_mentions_send_notifications = true
# Can role/everyone pings be used at all
mass_mentions_enabled = true

[features.limits]

[features.limits.global]
group_size = 100
message_embeds = 10
message_replies = 5
message_reactions = 20
server_emoji = 100
server_roles = 200
server_channels = 200

# How many hours since creation a user is considered new
new_user_hours = 72

# Maximum permissible body size in bytes for uploads
# (greater than any one file upload limit, to leave room for the multipart
# envelope, and under the 100 MB Cloudflare accepts on its free plan)
body_limit_size = 96_000_000

# If any userids are entered here, only those users will be able to create servers.
# Leave empty to allow all users to create servers
restrict_server_creation = []

# Number of days after creation before an invite expires
max_invite_duration_days = 30

# Days until an invite expires when its creator chose no time ("never" stays possible)
default_invite_duration_days = 7

# Raid alert: more than raid_alert_joins joins within raid_alert_minutes posts
# an alert (with "Pause invites") in the server's join message channel; 0 = off
raid_alert_joins = 10
raid_alert_minutes = 1

# Longest member timeout in days
max_timeout_days = 28

# New bots a user may make per 7 days
bot_creations_per_week = 7

[features.limits.new_user]
# Limits imposed on new users

# Number of outgoing friend requests permitted at any time
outgoing_friend_requests = 5

# Bots per user: no real cap (making them is paced per week)
bots = 1000

# Message content length
message_length = 2000

# Number of attachments that can be included
message_attachments = 5

# Maximum number of servers the user can create/join
servers = 50

# Maximum audio frequency (Hz) in voice calls
voice_quality = 16000

# Whether the user can use video streams in voice calls
video = true

# Maximum resolution (width, height) of video streams in voice calls
video_resolution = [1080, 720]

# Minimum and maximum aspect ratio of video streams in voice calls
video_aspect_ratio = [0.3, 2.5]

[features.limits.new_user.file_upload_size_limit]
# Maximum file size limits (in bytes)
attachments = 20_000_000
avatars = 4_000_000
backgrounds = 6_000_000
icons = 2_500_000
banners = 6_000_000
emojis = 500_000
decorations = 2_500_000
effects = 2_000_000

[features.limits.default]
# Limits imposed on users by default

# Number of outgoing friend requests permitted at any time
outgoing_friend_requests = 10

# Bots per user: no real cap (making them is paced per week)
bots = 1000

# Message content length
message_length = 2000

# Number of attachments that can be included
message_attachments = 5

# Maximum number of servers the user can create/join
servers = 100

# Maximum audio frequency (Hz) in voice calls
voice_quality = 16000

# Whether the user can use video streams in voice calls
video = true

# Maximum resolution (width, height) of video streams in voice calls
video_resolution = [1280, 720]

# Minimum and maximum aspect ratio of video streams in voice calls
video_aspect_ratio = [0.3, 2.5]

[features.limits.default.file_upload_size_limit]
# Maximum file size limits (in bytes)
attachments = 20_000_000
avatars = 4_000_000
backgrounds = 6_000_000
icons = 2_500_000
banners = 6_000_000
emojis = 500_000
decorations = 2_500_000
effects = 2_000_000


[features.limits.plus]
# Limits for members with Zrzur Feather (only applied while billing is available)

outgoing_friend_requests = 10
bots = 1000
message_length = 4000
message_attachments = 5
servers = 100
voice_quality = 16000
video = true
video_resolution = [1920, 1080]
video_aspect_ratio = [0.3, 2.5]
video_framerate = 60

[features.limits.plus.file_upload_size_limit]
attachments = 95_000_000
avatars = 4_000_000
backgrounds = 6_000_000
icons = 2_500_000
banners = 6_000_000
emojis = 500_000
decorations = 2_500_000
effects = 2_000_000

[features.community]
# Community designs: only creators granted by staff can upload, and their
# designs are published straight away (reviewers can still suspend them).
# The file size limit is the `decorations` upload limit.
max_items_per_creator = 50
max_dimension = 1024
max_frames = 240
max_duration_ms = 12_000
# Creator effects: transparent animations that play once. Off keeps uploads,
# the gallery and the files closed, and stops all of them at once (restart
# delta and autumn). The file size limit is the `effects` upload limit.
effects_enabled = false
effect_max_dimension = 1024
effect_max_frames = 120
effect_max_duration_ms = 4_000
effect_min_frame_ms = 33
# A WebM for a design is turned into an animated WebP on upload and never
# stored. It may be this big going in; ffmpeg is killed after this long.
webm_max_bytes = 8_000_000
webm_timeout_ms = 20_000

[features.age_safety]
# Sign-up may take the month and year of birth (off: the app asks at the
# first entry, PATCH /auth/account/age, which refuses anyone under 16).
require_birth_month = false
# every request of a person waits until an age is declared
require_declared_age = true
# Who may open channels and Servers marked as mature:
# "self_declared_adults" (declared age 18+; pornography stays forbidden by
# the rules) or "blocked" (nobody, until a real age check exists). Default: blocked.
mature_content = "blocked"

[features.billing]
# Zrzur Feather (member subscription) and Wings (server supercharges).
# Only test mode exists: purchases are simulated and nothing is charged.
# Off by default; billing routes refuse and no perks apply while off.
enabled = false
test_mode = false
currency = "USD"
# Monthly prices in cents
plus_price = 499
supercharge_price = 299
plus_free_supercharges = 1
# Emoji slots of a server without supercharges
free_server_emoji = 50
# Official server and the role its Plus members get (leave empty for none)
hq_server = ""
plus_role = ""

# Payment providers (a buyer picks one). Secrets are never written here:
# each provider reads them from environment variables. A provider whose
# variables are missing is left out; the others keep working. All of them
# must be in the same environment ("sandbox" or "live").
#
# [features.billing.provider]           # preferred provider
# name = "stripe"
# environment = "sandbox"
# # ZRZUR_STRIPE_SECRET_KEY, ZRZUR_STRIPE_WEBHOOK_SECRET
# # webhook: https://api.zrzur.com/billing/webhooks/stripe
#
# [[features.billing.providers]]        # more providers
# name = "paypal"
# environment = "sandbox"
# # plan ids from the PayPal dashboard (monthly plans, quantity allowed
# # for Wings); one-time purchases need no plan
# plus_price_id = "P-..."
# supercharge_price_id = "P-..."
# # ZRZUR_PAYPAL_CLIENT_ID, ZRZUR_PAYPAL_CLIENT_SECRET, ZRZUR_PAYPAL_WEBHOOK_ID
# # webhook: https://api.zrzur.com/billing/webhooks/paypal

[[features.billing.levels]]
supercharges = 2
server_emoji = 100
attachments = 25_000_000
voice_bitrate = 128_000
video_resolution = [1280, 720]
video_framerate = 60

[[features.billing.levels]]
supercharges = 7
server_emoji = 150
attachments = 50_000_000
voice_bitrate = 256_000
video_resolution = [1920, 1080]
video_framerate = 60

[[features.billing.levels]]
supercharges = 14
server_emoji = 250
attachments = 95_000_000
voice_bitrate = 384_000
video_resolution = [1920, 1080]
video_framerate = 60
# custom invite link zrzur.cc/<name>
vanity_invite = true

[features.billing.discover]
# Paid placement on Discover (only while billing is available)
# Members a server needs to show up without a boost
min_members = 5
promotion_days = 7
# Price for the top row, for promotion_days
promoted_price = 799
# Places in the top row (servers and bots each have their own)
promoted_slots = 4

# Boost tiers, lowest first. A boosted listing shows at its guaranteed
# place or higher; only the biggest active boost counts. Each tier has as
# many places as its guarantee allows (20 / 30 / 50); when a tier is full,
# new buyers wait in line and start when a place frees up.
[[features.billing.discover.boosts]]
kind = "Boost"
price = 149
guarantee = 100

[[features.billing.discover.boosts]]
kind = "SuperBoost"
price = 299
guarantee = 50

[[features.billing.discover.boosts]]
kind = "MegaBoost"
price = 499
guarantee = 20

[features.advanced]
# The max amount of messages the rabbitmq provider/db mention adder job will delay for before forcing handling of a channel.
# default: 5
process_message_delay_limit = 5
# How many event ids to cache per bonfire connections.
# Higher numbers result in more deduplication but more ram usage.
seen_events_cache_size = 2048

[features.legal_links]
# URLs for legal documents
terms_of_service = ""
privacy_policy = ""
guidelines = ""

[sentry]
# Configuration for Sentry error reporting
api = ""
events = ""
voice_ingress = ""
files = ""
proxy = ""
pushd = ""
crond = ""
gifbox = ""
