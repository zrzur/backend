# Test configuration. Every value here is a test value, not for production.
# Test values only, never for production. This file is built into tests alone.
environment = "test"

[database]
# `database-test` in compose.yml, not the development database
mongodb = "mongodb://127.0.0.1:27018/?directConnection=true"
redis = "redis://localhost/"

[rabbit]
host = "127.0.0.1"
port = 5672
username = "rabbituser"
password = "rabbitpass"

[january]
proxy_key = "test-proxy-key"

[features]
webhooks_enabled = true
plugins_enabled = true

[features.community]
effects_enabled = true
frames_enabled = true

[features.rich_presence]
enabled = true
steam_enabled = true

# the application tests need it on; `applications_off_by_default` turns it
# off again to check the default
[features.badge_applications]
enabled = true

# Steam on: the tests answer for Steam in-process (delta util/steam.rs).
# Not a real key.
[api.connections.steam]
web_api_key = "test-steam-key-not-real"
return_origins = ["http://localhost:5173"]
# a maker asked: Portal 2 shows without pictures
no_picture_appids = [620]

# Twitch, GitHub and Battle.net on: the tests answer for them in-process
# (delta util/oauth_link.rs). Not real ids or secrets.
[api.connections.twitch]
client_id = "test-twitch-client"
client_secret = "test-twitch-secret"
return_origins = ["http://localhost:5173"]
eventsub_secret = "test-eventsub-secret-0123456789"
eventsub_callback = "https://api.test.invalid/connections/twitch/events"

[api.connections.github]
client_id = "test-github-client"
client_secret = "test-github-secret"
return_origins = ["http://localhost:5173"]

[api.connections.battlenet]
client_id = "test-battlenet-client"
client_secret = "test-battlenet-secret"
return_origins = ["http://localhost:5173"]

# The tests talk to a bot endpoint on 127.0.0.1
[api.interactions]
signing_key = "test-signing-key-of-at-least-32-bytes"
allow_private_urls = true

[api.smtp]
host = "localhost"
username = "smtp"
password = "smtp"
from_address = "development@zrzur.com"
reply_to = "support@zrzur.com"
port = 14025
use_tls = false

# Voice tests: a local LiveKit in dev mode (`livekit-test` in compose.yml)
[hosts.livekit]
voicetest = "ws://127.0.0.1:17880"

[api.livekit.nodes.voicetest]
url = "http://127.0.0.1:17880"
lat = 0.0
lon = 0.0
key = "devkey"
secret = "secret"

# File tests: MinIO from compose.yml
[files.s3]
endpoint = "http://127.0.0.1:14009"

# Tests exercise the adult path; the shipped default is "blocked"
[features.age_safety]
mature_content = "self_declared_adults"

[api.security.captcha]
# the sign-up tests all come from one test address: lift the per-address daily limit
signups_per_source_per_day = 1000000


# Badge programs: small numbers so the tests can reach them (production
# numbers are in Revolt.toml)
[api.badge_programs]
partner_members = 3
partner_age_days = 0
partner_weekly_active = 2
partner_weekly_contributors = 1
partner_retention_percent = 20
partner_weeks = 2
partner_retention_min_joins = 1
partner_review_days = 180
verified_server_members = 4
verified_server_age_days = 0
bot_servers = 1
bot_age_days = 0
bot_server_min_humans = 1
bot_servers_per_owner = 2
metrics_min_members = 1
reapply_days = 90
appeal_days = 30
evidence_days = 90
record_days = 365
draft_days = 30
creator_followers = 100000
creator_active_days = 90
creator_works = 5
creator_window_days = 90
creator_figures_fresh_days = 30
creator_code_days = 90
