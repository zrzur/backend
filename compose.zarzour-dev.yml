# Zarzour local Docker overlay for backend/compose.yml
#
# Usage (from backend/):
#   docker compose -f compose.yml -f compose.zarzour-dev.yml up -d
#
# Effects:
# - Project name zarzour-backend
# - Creates MinIO bucket matching Revolt.toml default_bucket (zarzour-uploads)
# - Puts Stoat-GHCR LiveKit image behind profile `voice` (opt-in)
# - Optional voice profile uses official livekit/livekit-server (not ghcr.io/stoatchat)
#
# Does NOT start API/events/web from upstream GHCR — those run from local
# source builds (mise/cargo) or zarzour/* images built from Dockerfiles.

name: zarzour-backend

# WSL2 note: bind mounts under /mnt/c (NTFS) break MongoDB WiredTiger and
# RabbitMQ .erlang.cookie permissions. Use named volumes for local Phase 01.
volumes:
  zarzour_mongo_data:
  zarzour_rabbit_data:
  zarzour_minio_data:

services:
  # LiveKit (profile voice) shares this network namespace — publish its ports here.
  redis:
    ports:
      - "6379:6379"
      - "7880:7880"
      - "7881:7881"
      - "14706:7880"
      - "50000-50100:50000-50100/udp"

  database:
    volumes:
      - zarzour_mongo_data:/data/db
    # rs0 member must be reachable as Docker DNS name from api/events/autumn.
    # Existing volumes may still have 127.0.0.1 — reconfig once (non-destructive):
    #   docker compose exec database mongosh --eval 'try{rs.reconfig({_id:"rs0",members:[{_id:0,host:"database:27017"}]},{force:true})}catch(e){rs.initiate({_id:"rs0",members:[{_id:0,host:"database:27017"}]})}'
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'database:27017'}]}) }" | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 30s
      start_period: 0s
      start_interval: 1s
      retries: 30

  rabbit:
    volumes:
      - zarzour_rabbit_data:/var/lib/rabbitmq

  minio:
    volumes:
      - zarzour_minio_data:/data

  createbuckets:
    entrypoint: >
      /bin/sh -c "
      while ! /usr/bin/mc ready minio; do
        /usr/bin/mc alias set minio http://minio:9000 minioautumn minioautumn;
        echo 'Waiting minio...' && sleep 1;
      done;
      /usr/bin/mc mb minio/zarzour-uploads || true;
      /usr/bin/mc mb minio/revolt-uploads || true;
      exit 0;
      "

  # Disable default Stoat GHCR LiveKit; enable with --profile voice.
  # Share redis network namespace so livekit.example.yml `localhost:6379` works
  # and LiveKit joins the compose DNS network (overrides compose.yml host mode).
  livekit:
    profiles: ["voice"]
    image: livekit/livekit-server:v1.9.1
    network_mode: "service:redis"
    ports: !reset []
    command: --config /etc/livekit.yml
    volumes:
      - ./livekit.yml:/etc/livekit.yml
    depends_on:
      - redis
