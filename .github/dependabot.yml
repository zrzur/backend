version: 2
# One pull request per ecosystem and week, against beta. A dependency pull
# request cannot pass "Source integrity" on its own: a maintainer reviews it,
# regenerates PUBLIC_SOURCE_MANIFEST.json on its branch, then merges into beta.
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: beta
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    target-branch: beta
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 2
  - package-ecosystem: docker
    directory: /
    target-branch: beta
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
    open-pull-requests-limit: 2
